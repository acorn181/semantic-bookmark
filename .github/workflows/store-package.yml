name: Build Chrome Web Store package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Create Chrome Web Store ZIP
        shell: bash
        run: |
          cd dist
          zip -r ../semantic-bookmark-cws.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-bookmark-cws
          path: semantic-bookmark-cws.zip
          if-no-files-found: error
